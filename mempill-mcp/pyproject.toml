[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mempill-mcp"
version = "0.4.0"
description = "MCP (Model Context Protocol) server exposing the mempill AI-agent memory engine as tools"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Aliaksei Ivanouski" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mempill>=0.4.0,<0.5",
    "mcp>=1.9,<2",
]

[project.urls]
Homepage = "https://mempill.netlify.app"
Repository = "https://github.com/mempill-ai/mempill"
Documentation = "https://mempill.netlify.app"

[project.scripts]
mempill-mcp = "mempill_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mempill_mcp"]
